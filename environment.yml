# Environment used for the official active-learning runs (OFFICIAL-RUNS/):
# Python 3.8.10 venv on the Alliance cluster nibi. The cluster wheels were
# Compute Canada builds (+computecanada) of the same version numbers.
name: delta-ml-al
channels:
  - conda-forge
dependencies:
  - python=3.8.10
  - pip
  - pip:
      - -r requirements.txt
